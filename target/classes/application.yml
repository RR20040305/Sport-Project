spring:
  application:
    name: sport-complex

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:55432/sport_complex}
    username: ${SPRING_DATASOURCE_USERNAME:sport_complex_app}
    password: ${SPRING_DATASOURCE_PASSWORD:SuperSecretPassword123!}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    secret-base64: ${JWT_SECRET_BASE64:c3VwZXItc2VjcmV0LWp3dC1rZXktZm9yLXNwb3J0LWNvbXBsZXgtc3lzdGVtLTIwMjU=}
    issuer: ${JWT_ISSUER:sport-complex}
    access-minutes: ${ACCESS_TOKEN_MINUTES:15}
    refresh-days: ${REFRESH_TOKEN_DAYS:14}

  bootstrap:
    email: ${BOOTSTRAP_ADMIN_EMAIL:admin@example.org}
    name: ${BOOTSTRAP_ADMIN_NAME:System Administrator}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:Adm1!750DF9E52689A0B47E4DE85BC5C8AAC0}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080}